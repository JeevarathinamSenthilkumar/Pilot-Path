<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="35" fill="#eaf4ff"/><text x="60" y="78" font-family="Arial" font-size="38" font-weight="bold" fill="#133550">Your Flight Instructor</text><text x="60" y="118" font-family="Arial" font-size="21" fill="#42647e">A coach, evaluator, and safety mentor</text><rect x="80" y="170" width="350" height="255" rx="30" fill="#cce8ff"/><rect x="570" y="170" width="350" height="255" rx="30" fill="#d9f6ea"/><text x="255" y="245" font-family="Arial" font-weight="bold" font-size="31" text-anchor="middle" fill="#133550">Instructor</text><text x="255" y="295" font-family="Arial" font-size="22" text-anchor="middle" fill="#133550">Explains and demonstrates</text><text x="255" y="334" font-family="Arial" font-size="22" text-anchor="middle" fill="#133550">Observes and evaluates</text><text x="255" y="373" font-family="Arial" font-size="22" text-anchor="middle" fill="#133550">Endorses when ready</text><text x="745" y="245" font-family="Arial" font-weight="bold" font-size="31" text-anchor="middle" fill="#133550">Student</text><text x="745" y="295" font-family="Arial" font-size="22" text-anchor="middle" fill="#133550">Asks and practices</text><text x="745" y="334" font-family="Arial" font-size="22" text-anchor="middle" fill="#133550">Reflects on each flight</text><text x="745" y="373" font-family="Arial" font-size="22" text-anchor="middle" fill="#133550">Builds good judgment</text><path d="M 435 265 L 565 265 M 550 252 L 565 265 L 550 278" stroke="#367cbb" stroke-width="8" fill="none"/><path d="M 565 345 L 435 345 M 450 332 L 435 345 L 450 358" stroke="#17977d" stroke-width="8" fill="none"/><text x="500" y="495" text-anchor="middle" font-family="Arial" font-size="23" fill="#133550">Both share responsibility for learning and safety.</text></svg>