<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="1000" height="500" rx="30" fill="#edf6ff"/><text x="45" y="65" font-family="Arial" font-size="37" font-weight="bold" fill="#123854">Medical certificate overview</text><text x="45" y="103" font-family="Arial" font-size="19" fill="#476b86">Applicable medical requirements depend on the privileges exercised</text><rect x="45" y="155" width="282" height="240" rx="25" fill="#d9e9ff"/><rect x="359" y="155" width="282" height="240" rx="25" fill="#d9f6e8"/><rect x="673" y="155" width="282" height="240" rx="25" fill="#fff0d6"/><g fill="#153e5c" font-family="Arial" text-anchor="middle"><text x="186" y="226" font-size="30" font-weight="bold">First class</text><text x="186" y="280" font-size="21">Generally airline</text><text x="186" y="313" font-size="21">transport privileges</text><text x="500" y="226" font-size="30" font-weight="bold">Second class</text><text x="500" y="280" font-size="21">Generally commercial</text><text x="500" y="313" font-size="21">pilot privileges</text><text x="814" y="226" font-size="30" font-weight="bold">Third class</text><text x="814" y="280" font-size="21">Common for many</text><text x="814" y="313" font-size="21">private pilot operations</text><text x="500" y="448" font-size="19">Other permitted medical qualification pathways exist; check current FAA rules.</text></g></svg>