<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480"><rect width="1000" height="480" rx="32" fill="#eaf4ff"/><text x="45" y="68" font-family="Arial" font-size="37" font-weight="bold" fill="#143d5d">Before your first solo</text><g font-family="Arial" fill="#163b58"><rect x="45" y="130" width="205" height="220" rx="25" fill="#d3e7ff"/><text x="147" y="190" font-size="24" text-anchor="middle" font-weight="bold">1 · Training</text><text x="147" y="236" font-size="18" text-anchor="middle">Learn and practice</text><text x="147" y="269" font-size="18" text-anchor="middle">with a CFI</text><rect x="280" y="130" width="205" height="220" rx="25" fill="#ccefe5"/><text x="382" y="190" font-size="24" text-anchor="middle" font-weight="bold">2 · Eligibility</text><text x="382" y="236" font-size="18" text-anchor="middle">Certificate,</text><text x="382" y="269" font-size="18" text-anchor="middle">medical as required</text><rect x="515" y="130" width="205" height="220" rx="25" fill="#fff0d7"/><text x="617" y="190" font-size="24" text-anchor="middle" font-weight="bold">3 · Endorsement</text><text x="617" y="236" font-size="18" text-anchor="middle">Specific instructor</text><text x="617" y="269" font-size="18" text-anchor="middle">authorization</text><rect x="750" y="130" width="205" height="220" rx="25" fill="#e6ddff"/><text x="852" y="190" font-size="24" text-anchor="middle" font-weight="bold">4 · Solo</text><text x="852" y="236" font-size="18" text-anchor="middle">Operate within</text><text x="852" y="269" font-size="18" text-anchor="middle">every limitation</text><text x="500" y="417" font-size="22" text-anchor="middle">Solo is earned through proficiency and required authorization, not just hours.</text></g></svg>